name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Verification
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Full Frontend Preflight Check
        run: npm run check

  backend:
    name: Rust Backend Verification
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Create frontend dist stub for Tauri context
        run: |
          mkdir dist -Force
          Set-Content -Path dist/index.html -Value "<!DOCTYPE html><html><body></body></html>"

      - name: Cargo Clippy (Zero-Warnings Enforced)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Run zmm-cli Diagnostics Health-Check
        run: cargo run --manifest-path src-tauri/Cargo.toml --bin zmm-cli -- health-check
