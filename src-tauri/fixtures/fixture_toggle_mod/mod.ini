[Constants]
global persist $outfit = 0

[KeyToggleOutfit]
key = f
type = cycle
$outfit = 0, 1

[TextureOverrideOutfit]
hash = 625c2692
match_first_index = 0
ib = ResourceOutfitIB
vb0 = ResourceOutfitPosition
drawindexed = 3, 0, 0
if $outfit == 0
  ps-t0 = ResourceOutfitDiffuseA
else
  ps-t0 = ResourceOutfitDiffuseB
endif

[ResourceOutfitPosition]
type = Buffer
stride = 40
filename = outfit_pos.buf

[ResourceOutfitIB]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = outfit.ib

[ResourceOutfitDiffuseA]
filename = diffuse_a.png

[ResourceOutfitDiffuseB]
filename = diffuse_b.png
