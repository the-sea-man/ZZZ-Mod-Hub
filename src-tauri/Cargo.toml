[package]
name = "zzzmodmanager-tauri"
version = "1.2.6"
default-run = "zzzmodmanager-tauri"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zzzmodmanager_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zzzmodmanager-tauri"
path = "src/main.rs"

[[bin]]
name = "zmm-cli"
path = "src/bin/zmm_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
rand = "0.8"
zip = "0.6"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"
tauri-plugin-global-shortcut = "2.3.2"
screenshots = "0.8.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
notify = "8.2.0"
notify-debouncer-full = "0.6.0"
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "psapi", "handleapi", "tlhelp32"] }
sha2 = "0.10"
base64 = "0.22"
regex = "1.10"
byteorder = "1.5"
half = "2.4"
rayon = "1.10"
image_dds = "0.7.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
